<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="rgb(191, 54, 12)" />
    <title>Run Tracker</title>
    <meta name="description" content="A run recorded with Run Tracker for KaiOS." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" />
    <style>
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  font-family: "Open Sans", sans-serif;
  background-color: #e1e2e1;
  color: #111;
}
header {
  background-color: rgb(191, 54, 12);
  color: white;
  padding: 6px 10px;
}
header h1 {
  margin: 0;
  font-size: 16px;
  text-transform: uppercase;
}
header p {
  margin: 0;
  font-size: 13px;
}
#status {
  padding: 8px 10px;
  font-size: 14px;
}
#stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
  gap: 4px;
  padding: 4px;
}
.stat {
  background-color: white;
  border-radius: 10px;
  padding: 3px 10px;
}
.stat .label {
  display: block;
  color: #555;
  font-size: 11px;
}
.stat .value {
  display: block;
  font-size: 15px;
  font-weight: bold;
}
.stat .sub {
  display: block;
  font-size: 11px;
  color: #333;
}
#map {
  width: 100%;
  height: 70vh;
  min-height: 220px;
}
footer {
  padding: 6px 10px 12px;
  font-size: 11px;
  color: #555;
}
.hidden {
  display: none !important;
}
    </style>
  </head>

  <body>
    <header>
      <h1>Run Tracker</h1>
      <p id="run-date"></p>
    </header>
    <div id="status">Loading run...</div>
    <div id="stats" class="hidden">
      <div class="stat"><span class="label">Distance</span><span class="value" id="stat-km"></span><span class="sub" id="stat-mi"></span></div>
      <div class="stat"><span class="label">Time</span><span class="value" id="stat-duration"></span></div>
      <div class="stat"><span class="label">Avg pace</span><span class="value" id="stat-pace-km"></span><span class="sub" id="stat-pace-mi"></span></div>
      <div class="stat"><span class="label">Avg speed</span><span class="value" id="stat-kmh"></span><span class="sub" id="stat-mph"></span></div>
    </div>
    <div id="map" class="hidden"></div>
    <footer id="footer" class="hidden"></footer>

    <script src="../js/stats.js?v=1.0.0"></script>
    <script src="../js/view.js?v=1.0.0"></script>
  </body>
</html>
